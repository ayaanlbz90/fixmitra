<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - FixMitra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-4 text-center">Complete Your Payment</h2>
            
            {% if success %}
                <div class="alert alert-success">
                    <h4 class="alert-heading">Choice Saved!</h4>
                    <p>Booking Code: <strong>{{ booking.booking_code }}</strong></p>
                    <p>Payment Status: <strong>{{ booking.payment_status }}</strong></p>
                    <hr>
                    <a href="{{ url_for('track', code=booking.booking_code) }}" class="btn btn-primary w-100">Track Order</a>
                </div>
            {% else %}
                <p><strong>Booking Code:</strong> {{ booking.booking_code }}</p>
                <p><strong>Estimated Cost:</strong> {{ booking.estimated_cost }}</p>
                
                <form method="POST">
                    <div class="form-check mb-3 p-3 border rounded">
                        <input class="form-check-input" type="radio" name="payment_method" id="pay_online" value="online" checked>
                        <label class="form-check-label" for="pay_online">
                            <strong>Pay Online Now</strong> (UPI, Credit/Debit Card, Net Banking)
                        </label>
                    </div>

                    <div class="form-check mb-4 p-3 border rounded">
                        <input class="form-check-input" type="radio" name="payment_method" id="pay_later" value="pay_later">
                        <label class="form-check-label" for="pay_later">
                            <strong>Pay After Service</strong> (Cash or UPI on completion)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg">Confirm Payment Choice</button>
                </form>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
