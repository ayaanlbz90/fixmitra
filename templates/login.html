{% extends 'base.html' %}
{% block title %}Login — FixMitra{% endblock %}
{% block content %}
<div class="container" style="padding: 72px 0;">
    <div class="card max-w-sm">
        <h2 class="mb-8">Login to FixMitra</h2>
        <p class="text-muted mb-24">Access your repairs, warranties, and status.</p>

        {% if error %}
            <div class="alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="you@domain.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login →</button>
        </form>
        <p class="text-center text-muted mt-16" style="font-size:0.9rem;">
            Don't have an account? <a href="/register">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
