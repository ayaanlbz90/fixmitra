<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - FixMitra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-4">
<div class="container-fluid">
    <h2 class="mb-4">Admin Control Panel</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Manage Orders</h4>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Device</th>
                            <th>City</th>
                            <th>Repair Status</th>
                            <th>Payment Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for b in bookings %}
                        <tr>
                            <td><strong>{{ b.booking_code }}</strong></td>
                            <td>{{ b.user_name }}</td>
                            <td>{{ b.phone }}</td>
                            <td>{{ b.brand }} {{ b.device_type }}</td>
                            <td>{{ b.city }}</td>
                            <form method="POST" action="{{ url_for('admin') }}">
                                <input type="hidden" name="booking_id" value="{{ b.id }}">
                                <td>
                                    <select name="status" class="form-select form-select-sm">
                                        <option value="Booking Confirmed" {% if b.status == 'Booking Confirmed' %}selected{% endif %}>Booking Confirmed</option>
                                        <option value="Technician Assigned" {% if b.status == 'Technician Assigned' %}selected{% endif %}>Technician Assigned</option>
                                        <option value="In Progress" {% if b.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                                        <option value="Completed" {% if b.status == 'Completed' %}selected{% endif %}>Completed</option>
                                        <option value="Cancelled" {% if b.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                                    </select>
                                </td>
                                <td>
                                    <select name="payment_status" class="form-select form-select-sm">
                                        <option value="Unpaid (Pay After Service)" {% if 'Unpaid' in b.payment_status %}selected{% endif %}>Unpaid (Pay After Service)</option>
                                        <option value="Paid" {% if b.payment_status == 'Paid' %}selected{% endif %}>Paid</option>
                                    </select>
                                </td>
                                <td>
                                    <button type="submit" class="btn btn-sm btn-success">Update</button>
                                </td>
                            </form>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
