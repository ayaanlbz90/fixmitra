{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding: 60px 0;">
    <div class="card" style="max-width: 450px; margin: 0 auto;">
        <h2 style="margin-bottom: 8px;">Create Account</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Register to configure repairs and request doorstep visits.</p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" required placeholder="Fist-Name Last-Name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" required placeholder="+91 **********">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register ➔</button>
        </form>
    </div>
</div>
{% endblock %}
