{% extends 'base.html' %}
{% block title %}Create Account — FixMitra{% endblock %}
{% block content %}
<div class="container" style="padding: 72px 0;">
    <div class="card max-w-sm">
        <h2 class="mb-8">Create Account</h2>
        <p class="text-muted mb-24">Register to configure repairs and request doorstep visits.</p>

        {% if error %}
            <div class="alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" required placeholder="First Last">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" required placeholder="+91 **********">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register →</button>
        </form>
        <p class="text-center text-muted mt-16" style="font-size:0.9rem;">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
